<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Desbloquear console</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #03040a;
        }
        #stage {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            transform-origin: 0 0;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 45%, #0e1d3a 0%, #060912 60%, #03040a 100%);
            font-family: monospace;
            color: #e8f0ff;
        }
        #bg {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
        }
        #title {
            position: absolute;
            left: 0;
            top: 40px;
            width: 1920px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 76px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #eaf2ff;
            text-shadow: 0 0 18px rgba(63, 140, 255, 0.85), 0 0 4px rgba(63, 140, 255, 0.6);
        }
        #panel {
            position: absolute;
            left: 310px;
            top: 180px;
            width: 1300px;
            height: 780px;
            border-radius: 44px;
            background: rgba(5, 9, 18, 0.94);
            box-shadow: 0 0 60px rgba(40, 100, 220, 0.25);
        }
        #frame {
            position: absolute;
            left: 0;
            top: 0;
            width: 1300px;
            height: 780px;
            overflow: visible;
        }
        #text {
            position: absolute;
            left: 5%;
            top: 5%;
            width: 90%;
            height: 90%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }
        #output div {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 26px;
            line-height: 1.35;
            color: #cfe0ff;
        }
    </style>
</head>
<body>
<div id="stage">
    <svg id="bg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <rect x="68" y="68" width="64" height="64" rx="8" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.3" transform="rotate(12 100 100)"/>
    <rect x="1788" y="68" width="64" height="64" rx="8" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.3" transform="rotate(-12 1820 100)"/>
    <rect x="68" y="948" width="64" height="64" rx="8" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.3" transform="rotate(-8 100 980)"/>
    <rect x="1788" y="948" width="64" height="64" rx="8" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.3" transform="rotate(8 1820 980)"/>
    <circle cx="220" cy="70" r="24" fill="none" stroke="#4f8cff" stroke-width="4" opacity="0.25"/>
    <circle cx="1700" cy="70" r="24" fill="none" stroke="#4f8cff" stroke-width="4" opacity="0.25"/>
    <polygon points="220,1015 238,1046 202,1046" fill="none" stroke="#4f8cff" stroke-width="4" opacity="0.25"/>
    <polygon points="1700,1015 1718,1046 1682,1046" fill="none" stroke="#4f8cff" stroke-width="4" opacity="0.25"/>
    <circle cx="70" cy="330" r="22" fill="none" stroke="#2f6fe4" stroke-width="4" opacity="0.25"/>
    <circle cx="1850" cy="330" r="22" fill="none" stroke="#2f6fe4" stroke-width="4" opacity="0.25"/>
    <rect x="66" y="506" width="45" height="45" rx="6" fill="none" stroke="#2f6fe4" stroke-width="4" opacity="0.22" transform="rotate(20 88 528)"/>
    <rect x="1810" y="506" width="45" height="45" rx="6" fill="none" stroke="#2f6fe4" stroke-width="4" opacity="0.22" transform="rotate(-20 1832 528)"/>
    <path d="M939 1009 L981 1051 M981 1009 L939 1051" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.25" fill="none"/>
    </svg>

    <div id="title">Desbloqueando PS5</div>

    <div id="panel">
        <svg id="frame" viewBox="0 0 1300 780" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <path d="M44 4 H1256 A40 40 0 0 1 1296 44 V736 A40 40 0 0 1 1256 776 H44 A40 40 0 0 1 4 736 V44 A40 40 0 0 1 44 4 Z" fill="none" stroke="#14284a" stroke-width="8"/>
            <path id="arc-right" d="M650 4 H1256 A40 40 0 0 1 1296 44 V736 A40 40 0 0 1 1256 776 H650" fill="none" stroke="#3b8cff" stroke-width="8" stroke-dasharray="0 1" filter="url(#glow)"/>
            <path id="arc-left" d="M650 4 H44 A40 40 0 0 0 4 44 V736 A40 40 0 0 0 44 776 H650" fill="none" stroke="#3b8cff" stroke-width="8" stroke-dasharray="0 1" filter="url(#glow)"/>
        </svg>
        <div id="text"><div id="output"></div></div>
    </div>
</div>
<script>
    (function () {
        function fit() {
            var s = window.innerWidth / 1920;
            document.getElementById('stage').style.transform = 'scale(' + s + ')';
        }
        fit();
        window.addEventListener('resize', fit);
    })();
    // Permite ao main.js trocar o título conforme o estado (ex.: erro, atualização)
    window.setTitle = function (t) {
        var el = document.getElementById('title');
        if (el) el.textContent = t;
    };
</script>
<script src="main.js"></script>
</body>
</html>
